name: Jellyfin plugin

on:
  push:
    paths:
      - 'jellyfin-plugin/**'
      - '.github/workflows/jellyfin-plugin.yml'
  pull_request:
    paths:
      - 'jellyfin-plugin/**'
      - '.github/workflows/jellyfin-plugin.yml'
  workflow_dispatch:
    inputs:
      jellyfin_version:
        description: 'Jellyfin SDK version (Jellyfin.Controller/Jellyfin.Model) to compile against'
        required: false
        default: '12.4.0'
  # Called by jellyfin-plugin-release.yml so releases use exactly this build.
  workflow_call:
    inputs:
      jellyfin_version:
        description: 'Jellyfin SDK version (Jellyfin.Controller/Jellyfin.Model) to compile against'
        required: false
        type: string
        default: '12.4.0'

permissions:
  contents: read

jobs:
  build:
    name: Build (Jellyfin ${{ inputs.jellyfin_version || '12.4.0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: jellyfin-plugin/Lobby
        env:
          JELLYFIN_VERSION: ${{ inputs.jellyfin_version || '12.4.0' }}
        run: |
          set -o pipefail
          if ! dotnet build -c Release -p:JellyfinSdkVersion="$JELLYFIN_VERSION" 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            # Surface every error as an annotation so it shows on the run summary.
            grep -E ': error [A-Z]+[0-9]+' "$RUNNER_TEMP/build.log" | sort -u | head -30 | sed 's/^/::error::/' || true
            exit 1
          fi

      - name: Check output
        working-directory: jellyfin-plugin/Lobby
        run: |
          set -euo pipefail
          dll=bin/Release/net10.0/Lobby.dll
          test -s "$dll"
          echo "Built $(du -h "$dll" | cut -f1) $dll"

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: Lobby-jellyfin-${{ inputs.jellyfin_version || '12.4.0' }}
          path: jellyfin-plugin/Lobby/bin/Release/net10.0/Lobby.dll
          if-no-files-found: error
